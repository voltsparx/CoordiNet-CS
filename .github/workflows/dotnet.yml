name: .NET Build and Test

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['8.0.x', '10.0.x']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore src/CoordiNet-CS.csproj; dotnet restore tests/CoordiNet-CS.Tests/CoordiNet-CS.Tests.csproj

    - name: Build Main Project
      run: dotnet build src/CoordiNet-CS.csproj --configuration Release --no-restore -nologo

    - name: Build Test Project
      run: dotnet build tests/CoordiNet-CS.Tests/CoordiNet-CS.Tests.csproj --configuration Release --no-restore -nologo

    - name: Verify Test DLL exists
      run: |
        $dllPath = "tests/CoordiNet-CS.Tests/bin/Release/net10.0/CoordiNet-CS.Tests.dll"
        if (Test-Path $dllPath) {
          Write-Host "✓ Test DLL found at $dllPath"
          Get-Item $dllPath
        } else {
          Write-Host "✗ Test DLL NOT found at $dllPath"
          Write-Host "Directory contents:"
          Get-ChildItem -Path "tests/CoordiNet-CS.Tests/bin/Release" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          exit 1
        }
      shell: pwsh

    - name: Run tests
      run: dotnet test tests/CoordiNet-CS.Tests/CoordiNet-CS.Tests.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.dotnet-version }}
        path: '**/test-results.trx'

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && runner.os == 'Linux'
      with:
        files: '**/test-results.trx'
        check_name: 'Test Results (${{ matrix.os }}, .NET ${{ matrix.dotnet-version }})'
