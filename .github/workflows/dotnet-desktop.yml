name: .NET Desktop Build, Test, and Publish

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x', '10.0.x']
        configuration: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore src/CoordiNet-CS.csproj; dotnet restore tests/CoordiNet-CS.Tests/CoordiNet-CS.Tests.csproj

    - name: Build Desktop Application
      run: dotnet build src/CoordiNet-CS.csproj --configuration ${{ matrix.configuration }} --no-restore -nologo

    - name: Build Test Project
      run: dotnet build tests/CoordiNet-CS.Tests/CoordiNet-CS.Tests.csproj --configuration ${{ matrix.configuration }} --no-restore -nologo

    - name: Verify Test DLL exists
      run: |
        $dllPath = "tests/CoordiNet-CS.Tests/bin/${{ matrix.configuration }}/net10.0/CoordiNet-CS.Tests.dll"
        if (Test-Path $dllPath) {
          Write-Host "✓ Test DLL found at $dllPath"
          Get-Item $dllPath
        } else {
          Write-Host "✗ Test DLL NOT found at $dllPath"
          Write-Host "Directory contents:"
          Get-ChildItem -Path "tests/CoordiNet-CS.Tests/bin/${{ matrix.configuration }}" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          exit 1
        }
      shell: pwsh

    - name: Run Tests
      run: dotnet test tests/CoordiNet-CS.Tests/CoordiNet-CS.Tests.csproj --configuration ${{ matrix.configuration }} --verbosity normal

    - name: Publish (Release builds only)
      if: matrix.configuration == 'Release'
      run: dotnet publish src/CoordiNet-CS.csproj --configuration Release --output ./publish -nologo

    - name: Create Release Package
      if: matrix.configuration == 'Release' && startsWith(github.ref, 'refs/tags/')
      run: |
        cd publish
        Compress-Archive -Path * -DestinationPath ../CoordiNet-CS-${{ matrix.dotnet-version }}-Release.zip
      shell: powershell

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: matrix.configuration == 'Release'
      with:
        name: coordinet-cs-${{ matrix.dotnet-version }}-${{ matrix.configuration }}
        path: publish/

    - name: Create GitHub Release
      if: matrix.configuration == 'Release' && startsWith(github.ref, 'refs/tags/') && matrix.dotnet-version == '8.0.x'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          CoordiNet-CS-*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
